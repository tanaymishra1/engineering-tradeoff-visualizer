<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Score engineering designs out of 100 by speed, torque and cost, with sliders, adjustable priorities and a chart of how each factor adds to the total.">
    <meta name="author" content="Tanay Mishra">
    <meta property="og:title" content="Engineering Trade-Off Visualizer | Tanay Mishra">
    <meta property="og:description" content="Score engineering designs out of 100 by speed, torque and cost, with sliders, adjustable priorities and a chart of how each factor adds to the total.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tanaymishra1.github.io/engineering-tradeoff-visualizer/">
    <meta property="og:image" content="https://tanaymishra1.github.io/engineering-tradeoff-visualizer/docs/screenshot.png">
    <title>Engineering Trade-Off Visualizer | Tanay Mishra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <h1>Engineering Trade-Off Visualizer</h1>
</nav>

<main>
<section class="card center">
    <h2>Design Setup</h2>

    <input
        type="text"
        id="designName"
        placeholder="Design Name (e.g., Drivetrain A)"
        class="design-name"
    >

    <div class="control-row">
        <label for="speed">Speed</label>
        <input type="range" id="speed" min="1" max="10" value="5">
        <span id="speedVal">5</span>
    </div>

    <div class="control-row">
        <label for="torque">Torque</label>
        <input type="range" id="torque" min="1" max="10" value="5">
        <span id="torqueVal">5</span>
    </div>

    <div class="control-row">
        <label for="cost">Cost</label>
        <input type="range" id="cost" min="1" max="10" value="5">
        <span id="costVal">5</span>
    </div>
</section>

<section class="card center">
    <h2>Design Priorities (Allocate 100 Points)</h2>

    <p class="hint">
        Distribute priority points to reflect design intent.
        Total must equal <strong>100</strong>.
    </p>

    <div class="priority-grid">
        <div>
            <label for="speedPriority">Speed Priority</label>
            <input type="number" id="speedPriority" value="40" min="0" max="100">
        </div>

        <div>
            <label for="torquePriority">Torque Priority</label>
            <input type="number" id="torquePriority" value="40" min="0" max="100">
        </div>

        <div>
            <label for="costPriority">Cost Priority</label>
            <input type="number" id="costPriority" value="20" min="0" max="100">
        </div>
    </div>

    <p id="priorityStatus"></p>
</section>

<section class="card center">
    <h2>Live Evaluation</h2>

    <canvas id="barChart" role="img" aria-label="Bar chart of how speed, torque, cost and the torque penalty add up to the raw total"></canvas>

    <div class="results">
        <p><strong>Score:</strong> <span id="score">0.0</span> / 100</p>
        <p><strong>Evaluation:</strong> <span id="evaluation"></span></p>
        <p><strong>Design Focus:</strong> <span id="focus"></span></p>
    </div>

    <button id="saveBtn">Save Design</button>
</section>

<section class="card center">
    <h2>Saved Designs (Ranked)</h2>
    <div id="designList"></div>
</section>

</main>

<script src="scoring.js"></script>
<script src="script.js"></script>
</body>
</html>
